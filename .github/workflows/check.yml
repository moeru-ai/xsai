name: check

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: latest
          registry-url: https://registry.npmjs.org

      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: latest
          registry-url: https://registry.npmjs.org

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: latest
          registry-url: https://registry.npmjs.org

      - uses: ai-action/setup-ollama@v2
      - uses: actions/cache@v6
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama
      - run: ollama pull qwen3-embedding:0.6b
      - run: ollama pull qwen3.5:0.8b
      - run: ollama pull tev1:0.8b
      - run: ollama serve > /dev/null 2>&1 &

      - run: pnpm install
      - run: pnpm test
      - run: pnpm test:e2e
