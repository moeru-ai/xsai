# eslint-disable pnpm/yaml-no-duplicate-catalog-item

minimumReleaseAgeExclude:
  - lucide-react@1.37.0

shellEmulator: true

trustPolicy: no-downgrade

packages:
  - docs
  - examples/*
  - packages/*
  - packages-ext/*
  - packages-top/*

catalog:
  '@antfu/eslint-config': ^9.2.0
  '@hey-api/openapi-ts': ^0.99.0
  '@moeru/eslint-config': ^0.1.0-beta.20
  '@moeru/std': ^0.1.0-beta.20
  '@moeru/tsconfig': ^0.1.0-beta.20
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/sdk-trace-base': ^2.10.0
  '@opentelemetry/sdk-trace-node': ^2.10.0
  '@orama/orama': ^3.1.18
  '@pnpm/find-workspace-dir': ^1000.1.5
  '@standard-schema/spec': 1.1.0
  '@tailwindcss/postcss': ^4.3.3
  '@types/json-schema': ^7.0.15
  '@types/mdx': ^2.0.14
  '@types/node': ^26.4.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@vitest/coverage-v8': ^4.1.11
  automd: ^0.4.3
  best-effort-json-parser: ^1.5.1
  bumpp: ^12.2.2
  clsx: ^2.1.1
  eslint: ^10.9.1
  eslint-plugin-oxlint: ^1.80.0
  eventsource-parser: ^3.0.6
  fumadocs-core: ^16.7.14
  fumadocs-mdx: ^14.2.13
  fumadocs-twoslash: ^3.1.17
  fumadocs-ui: ^16.7.14
  lucide-react: ^1.37.0
  next: ^16.2.3
  oxlint: ^1.80.0
  pkgroll: ^2.28.1
  postcss: ^8.5.26
  react: ^19.2.8
  react-dom: ^19.2.8
  recharts: ^2.15.4
  remark: ^15.0.1
  remark-gfm: ^4.0.1
  remark-mdx: ^3.1.1
  scule: ^1.3.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsdown: ^0.22.14
  tsx: ^4.23.12
  turbo: ^2.10.12
  tw-animate-css: ^1.4.0
  twoslash: ^0.3.9
  type-fest: ^5.8.0
  typescript: ~6.0.3
  vitest: ^4.1.11

catalogs:
  schema:
    '@valibot/to-json-schema': ^1.0.0
    arktype: ^2.1.20
    effect: ^3.16.0
    sury: ^10.0.0 || ^11.0.0-alpha
    valibot: ^1.0.0
    zod: ^3.25.0 || ^4.0.0
    zod-to-json-schema: ^3.25.0
  schema-dev:
    arktype: ^2.2.0
    effect: ^3.21.0
    sury: ^11.0.0-alpha.4
    zod: ^4.3.6

onlyBuiltDependencies:
  - unrs-resolver

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  protobufjs: false
  sharp: false
